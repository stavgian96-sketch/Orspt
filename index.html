<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F7F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Οργάνωση Σπιτιού</title>
<style>
:root{
  --bg:#F6F4F1;--bg2:#EEEBE6;--card:rgba(255,255,255,.55);--sheet:rgba(252,250,247,.88);
  --field:rgba(255,255,255,.62);--tx:#161c1a;--mu:#5c6662;--ac:#0F6B5F;--onac:#fff;
  --rd:#d03a2a;--onrd:#fff;--bd:rgba(22,28,26,.08);--gb:rgba(255,255,255,.78);
  --hi:rgba(255,255,255,.6);--spec:rgba(255,255,255,.92);--sh:rgba(15,40,35,.14);
  --wall:rgba(22,28,26,.45);--door:#FF6B3D;--rs:rgba(255,255,255,.9);
  --lbl:rgba(255,255,255,.55);--plate:rgba(255,255,255,.2);
  --g1:rgba(15,107,95,.18);--g2:rgba(255,140,100,.18);--navon:rgba(15,107,95,.12);
  --plusg:#b0432a;--blur:blur(28px) saturate(180%);
  --radius:20px;--radius-sm:14px;--radius-xs:10px;
  --nav-h:72px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070a09;--bg2:#0c110f;--card:rgba(30,40,37,.5);--sheet:rgba(16,22,20,.9);
    --field:rgba(255,255,255,.06);--tx:#eef2f0;--mu:#93a39e;--ac:#4fc4af;--onac:#04201a;
    --rd:#ff6b5b;--onrd:#2a0804;--bd:rgba(255,255,255,.08);--gb:rgba(255,255,255,.12);
    --hi:rgba(255,255,255,.1);--spec:rgba(255,255,255,.18);--sh:rgba(0,0,0,.5);
    --wall:rgba(255,255,255,.45);--door:#ff8a5c;--rs:rgba(255,255,255,.28);
    --lbl:rgba(0,0,0,.4);--plate:rgba(255,255,255,.04);
    --g1:rgba(26,160,135,.32);--g2:rgba(255,140,100,.1);--navon:rgba(79,196,175,.14);
    --plusg:#ffab8f;--blur:blur(36px) saturate(200%);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#070a09;--bg2:#0c110f;--card:rgba(30,40,37,.5);--sheet:rgba(16,22,20,.9);
  --field:rgba(255,255,255,.06);--tx:#eef2f0;--mu:#93a39e;--ac:#4fc4af;--onac:#04201a;
  --rd:#ff6b5b;--onrd:#2a0804;--bd:rgba(255,255,255,.08);--gb:rgba(255,255,255,.12);
  --hi:rgba(255,255,255,.1);--spec:rgba(255,255,255,.18);--sh:rgba(0,0,0,.5);
  --wall:rgba(255,255,255,.45);--door:#ff8a5c;--rs:rgba(255,255,255,.28);
  --lbl:rgba(0,0,0,.4);--plate:rgba(255,255,255,.04);
  --g1:rgba(26,160,135,.32);--g2:rgba(255,140,100,.1);--navon:rgba(79,196,175,.14);
  --plusg:#ffab8f;--blur:blur(36px) saturate(200%);color-scheme:dark;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;overflow-x:hidden;
  background:linear-gradient(165deg,var(--bg),var(--bg2)) fixed;
  color:var(--tx);
  font:16px/1.45 "Inter",-apple-system,"SF Pro Text",system-ui,sans-serif;
  font-feature-settings:"cv11","ss03";
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-t);
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px);
}
body::before{
  content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(42% 32% at 10% 6%,var(--g1),transparent 70%),
    radial-gradient(38% 30% at 92% 22%,var(--g2),transparent 70%),
    radial-gradient(48% 36% at 30% 100%,var(--g1),transparent 72%);
}

main{max-width:720px;margin:0 auto;padding:16px 16px 8px;min-width:0}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Cards */
.card{
  position:relative;
  background:linear-gradient(180deg,var(--hi),transparent 40%),var(--card);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--gb);
  border-radius:var(--radius);
  padding:16px 16px;
  margin-bottom:12px;
  box-shadow:inset 0 1px 0 var(--spec),0 10px 28px -12px var(--sh),0 1px 2px rgba(15,40,35,.04);
}
.card.hero{
  background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;
  text-align:center;padding:28px 0 12px;margin-bottom:4px;position:relative;
}
.hero>button{position:absolute!important;top:0;width:44px;height:44px;padding:0;border-radius:50%}
.hero>button:nth-child(1){right:0}.hero>button:nth-child(2){right:52px}

h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);margin:0 0 12px}
h3{font-size:22px;font-weight:700;letter-spacing:-.03em;margin:4px 0 14px}
.modal h3{font-size:20px;margin-top:0}

.clock{
  font-size:clamp(64px,22vw,112px);font-weight:700;letter-spacing:-.06em;line-height:.92;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,var(--tx) 35%,color-mix(in srgb,var(--tx) 35%,transparent));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
}
.date{font-size:17px;font-weight:500;letter-spacing:-.01em;margin-top:8px;color:var(--mu)}
.path{color:var(--mu);font-size:13.5px;line-height:1.45}
.warn{color:var(--rd)}

/* Form controls */
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{
  width:100%;padding:12px 14px;border-radius:var(--radius-sm);
  border:1px solid var(--bd);background:var(--field);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  margin-bottom:8px;transition:border-color .2s,box-shadow .25s;
}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--ac)!important;box-shadow:0 0 0 4px var(--g1);
}
input::placeholder{color:var(--mu);opacity:.75;font-size:14.5px}
input[type=checkbox]{width:20px;height:20px;padding:0;margin:0;accent-color:var(--ac);background:none;box-shadow:none}

/* Buttons */
button{
  position:relative;overflow:hidden;border:0;border-radius:var(--radius-sm);
  padding:12px 16px;font-weight:600;letter-spacing:-.01em;
  background:var(--ac) linear-gradient(180deg,rgba(255,255,255,.22),transparent 55%);
  color:var(--onac);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -8px var(--ac);
  cursor:pointer;
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),filter .2s,box-shadow .2s;
  min-height:44px;
}
button:active{transform:scale(.96);filter:brightness(.94);transition-duration:.08s}
@media(hover:hover){button:hover{filter:brightness(1.05)}}
button.g{
  background:var(--field) linear-gradient(180deg,rgba(255,255,255,.28),transparent);
  color:var(--tx);border:1px solid var(--gb);
  -webkit-backdrop-filter:blur(12px) saturate(160%);backdrop-filter:blur(12px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--spec),0 3px 10px -6px var(--sh);
}
button.r{background:rgba(208,58,42,.12);color:var(--rd);border:1px solid rgba(208,58,42,.22);box-shadow:none}
.modal button.r{background:var(--rd);color:var(--onrd);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:99px;min-height:40px}
button.plus{
  background:linear-gradient(180deg,#FFC9B2,#FFA687);color:#4a1a0c;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px -8px #FF8F6B;
  animation:pulse 3.2s ease-in-out infinite;
}
button.plus.g{background:var(--field);color:var(--plusg);border:1px solid var(--gb);animation:none}
button.plus:active{animation:none}
@keyframes pulse{
  0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px -8px #FF8F6B,0 0 0 0 rgba(255,143,107,.4)}
  55%{box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px -8px #FF8F6B,0 0 0 10px rgba(255,143,107,0)}
}
.lq{position:absolute;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.55),transparent 65%);
  transform:scale(0);animation:lq .55s ease-out both}
@keyframes lq{to{transform:scale(1);opacity:0}}

/* Rows & lists */
.row{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--bd);min-width:0;
}
.row:last-child{border:0}
.row>*{min-width:0}
.row button{flex-shrink:0}

/* Bottom nav — floating glass */
nav{
  position:fixed;left:12px;right:12px;bottom:calc(10px + var(--safe-b));
  max-width:560px;margin:0 auto;z-index:5;
  display:flex;gap:4px;padding:6px;
  border:1px solid var(--gb);border-radius:28px;
  background:linear-gradient(180deg,var(--hi),transparent 55%),var(--card);
  -webkit-backdrop-filter:blur(30px) saturate(200%);backdrop-filter:blur(30px) saturate(200%);
  box-shadow:inset 0 1px 0 var(--spec),0 14px 36px -10px var(--sh);
}
nav button{
  flex:1;border-radius:22px;background:none;border:0;box-shadow:none;
  color:var(--mu);padding:11px 2px 9px;font-size:11px;font-weight:600;
  letter-spacing:-.02em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
nav button.on{background:var(--navon);color:var(--ac);box-shadow:inset 0 1px 0 var(--spec)}

/* Modal */
.modal{
  position:fixed;inset:0;z-index:9;
  background:rgba(10,18,16,.38);
  -webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .22s both;
}
.modal>div{
  width:100%;max-width:560px;max-height:92dvh;overflow:auto;
  background:linear-gradient(180deg,var(--hi),transparent 28%),var(--sheet);
  -webkit-backdrop-filter:blur(40px) saturate(190%);backdrop-filter:blur(40px) saturate(190%);
  border:1px solid var(--gb);border-bottom:0;
  border-radius:28px 28px 0 0;
  padding:20px 18px calc(20px + var(--safe-b));
  box-shadow:inset 0 1px 0 var(--spec),0 -16px 48px -16px rgba(0,0,0,.3);
  animation:sheet .4s cubic-bezier(.2,.9,.25,1.05) both;
}
@keyframes fade{from{opacity:0}}
@keyframes sheet{from{transform:translateY(36px);opacity:0}}

/* Toast */
#tt{
  position:fixed!important;left:50%!important;right:auto!important;
  bottom:calc(var(--nav-h) + var(--safe-b) + 16px)!important;
  transform:translateX(-50%);width:min(480px,calc(100% - 24px));
  background:rgba(20,28,26,.88)!important;color:#fff!important;
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.12);border-radius:18px!important;
  padding:12px 16px;z-index:8;display:none;
  animation:toast .4s cubic-bezier(.2,.9,.3,1.15) both;
}
@keyframes toast{from{transform:translate(-50%,14px) scale(.96);opacity:0}}

/* Empty states */
.empty-state{text-align:center;padding:32px 16px;color:var(--mu)}
.empty-state .big{font-size:44px;line-height:1;margin-bottom:10px;opacity:.9}
.empty-state p{margin:0 0 14px;font-size:15px;line-height:1.45}
.empty-state button{margin-top:2px}

/* Misc */
.sticky-search{position:sticky;top:0;z-index:4;padding-top:4px;margin-top:-4px;
  background:linear-gradient(180deg,var(--bg) 55%,transparent);backdrop-filter:blur(10px)}
.exp-week{border-left:3px solid var(--rd);padding-left:10px}
.notif-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 9px;
  border-radius:99px;background:var(--navon);color:var(--ac);font-weight:600;vertical-align:middle}
.storage-warn{background:rgba(208,58,42,.1);border:1px solid rgba(208,58,42,.22);
  border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;color:var(--rd);font-size:13.5px}
img.th{width:48px;height:48px;object-fit:cover;border-radius:12px;float:left;margin-right:10px;cursor:pointer}
.hl{animation:glowp 1.6s ease-in-out infinite}
@keyframes glowp{0%,100%{filter:brightness(1) drop-shadow(0 0 4px rgba(15,107,95,.2))}50%{filter:brightness(1.25) drop-shadow(0 0 16px rgba(15,107,95,.85))}}
.row.bump{animation:bump .65s cubic-bezier(.34,1.56,.64,1) both}
@keyframes bump{0%{transform:scale(.93);opacity:0;background:rgba(15,107,95,.2)}60%{transform:scale(1.02)}100%{transform:none;background:transparent}}
.okr{position:fixed;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;
  border:1.5px solid var(--ac);background:radial-gradient(circle,var(--g1),transparent 70%);
  pointer-events:none;z-index:20;animation:okr .8s cubic-bezier(.2,.7,.3,1) both}
@keyframes okr{from{width:18px;height:18px;opacity:.95}to{width:280px;height:280px;opacity:0}}
.stag>.row{animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*40ms)}
#app.enter>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k,0)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(8px) scale(.988)}}
.row.fly{animation:fly .4s cubic-bezier(.5,0,.75,0) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes fly{to{transform:translateX(32%) scale(.96);opacity:0}}

/* SVG floor plan */
.card svg{overflow:visible}
svg polygon[onclick]{
  stroke:var(--rs)!important;stroke-width:2.5!important;stroke-dasharray:none!important;stroke-linejoin:round!important;
  transform-box:fill-box;transform-origin:center;
  filter:drop-shadow(0 2px 5px rgba(15,107,95,.12));
  transition:filter .3s,transform .45s cubic-bezier(.34,1.56,.64,1);
}
svg polygon[onclick]:hover{filter:brightness(1.06) drop-shadow(0 0 8px rgba(15,107,95,.4))}
svg polygon[onclick]:active{transform:scale(.97);filter:url(#lq) brightness(1.12) drop-shadow(0 0 14px rgba(15,107,95,.7));transition-duration:.1s}
svg polyline{stroke:var(--wall)!important;stroke-linecap:round!important;stroke-linejoin:round!important}
svg line{stroke-linecap:round!important}
svg line:not([style*="#d11"]){stroke:var(--wall)!important}
svg line[style*="#d11"]{stroke:var(--door)!important;stroke-width:4.5!important;filter:drop-shadow(0 0 3px var(--door))}
svg rect{stroke:var(--wall)!important;stroke-width:3!important;rx:10px;ry:10px}
svg rect[onclick]{fill:var(--plate)!important}
svg text{font-family:inherit;letter-spacing:-.01em;paint-order:stroke;stroke:var(--lbl);stroke-width:3px;stroke-linejoin:round}

/* Furniture layer */
#fl{pointer-events:none}
#fl [data-f]{pointer-events:all;cursor:pointer}
#fl text{pointer-events:none;paint-order:stroke;stroke:var(--lbl);stroke-linejoin:round}
#app.fe #fl [data-f],#app.fe #fl [data-h]{pointer-events:all;touch-action:none;cursor:grab}
#app.fe #fl [data-a]{pointer-events:all;cursor:pointer;touch-action:none}
#app.fe svg{touch-action:none;-webkit-user-select:none;user-select:none}
#app.fe #fl [data-h]{cursor:pointer}
#app.fe svg rect[onclick]{pointer-events:none}
.fsticky{position:sticky!important;top:6px;z-index:6;
  background:linear-gradient(180deg,var(--hi),transparent 42%),var(--bg)!important}

.chips button,.row button{white-space:normal;max-width:100%}
input,select,textarea{max-width:100%}

/* Print */
#pr{display:none;white-space:pre-wrap;font:13px monospace;color:#000;background:#fff}
@media print{
  main,nav,#md,#tt,body::before{display:none!important}
  #pr{display:block!important}body{background:#fff;padding:0}
}

/* ===== Responsive ===== */
/* Phone small */
@media(max-width:380px){
  main{padding:12px 10px}
  .card{padding:14px;border-radius:18px}
  h3{font-size:19px}
  nav{left:6px;right:6px;padding:5px;gap:2px}
  nav button{font-size:10px;padding:10px 0 8px;min-height:48px}
  .clock{font-size:58px}
}
/* Tablet */
@media(min-width:700px){
  main{max-width:820px;padding:20px 20px}
  .card{padding:18px}
  nav{max-width:520px}
}
/* Desktop */
@media(min-width:960px){
  main{max-width:1100px;padding:24px 24px}
  main.v-home,main.v-room,main.v-menu{
    display:grid;grid-template-columns:1fr 1fr;column-gap:16px;align-items:start;
  }
  main.v-home>button,main.v-room>button,main.v-room>h3,main.v-room>.bar,
  main.v-menu>h3,main.v-home>.card.hero,main.v-home>.sticky-search{
    grid-column:1/-1;
  }
  main.v-home>.card:first-of-type{grid-column:1/-1}
  main.v-plan{max-width:960px}
  main.v-shelf,main.v-shop,main.v-work{max-width:720px;margin-left:auto;margin-right:auto}
  .modal{align-items:center}
  .modal>div{border-radius:24px;border-bottom:1px solid var(--gb);max-width:520px;max-height:85vh}
  nav{bottom:18px;max-width:480px}
  body{padding-bottom:calc(var(--nav-h) + 28px)}
}
@media(min-width:1200px){
  main{max-width:1180px}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

/* ===== Premium v4 layer ===== */
.fab{
  position:fixed;right:max(16px, calc(50% - 360px + 16px));bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  width:58px;height:58px;border-radius:50%;z-index:6;padding:0;font-size:28px;line-height:1;
  background:linear-gradient(145deg,#FFB894,#FF8F6B);color:#3d1408;font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 10px 28px -6px rgba(255,143,107,.65),0 4px 12px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;
  animation:none;border:0;
}
.fab:active{transform:scale(.92)}
@media(min-width:960px){.fab{right:max(24px, calc(50% - 550px + 24px))}}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;
}
.stat{
  background:linear-gradient(180deg,var(--hi),transparent 50%),var(--card);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--gb);border-radius:16px;padding:12px 8px;text-align:center;
  box-shadow:inset 0 1px 0 var(--spec);
}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:11px;color:var(--mu);font-weight:500}
.stat.warn b{color:var(--rd)}
.stat.accent b{color:var(--ac)}

.menu-row{
  display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--bd);
  cursor:pointer;border-radius:12px;margin:0 -4px;padding-left:8px;padding-right:8px;
  transition:background .15s;
}
.menu-row:last-child{border:0}
.menu-row:active{background:var(--navon)}
.menu-ico{
  width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:var(--navon);flex-shrink:0;
}
.menu-row .chev{color:var(--mu);font-size:18px;opacity:.5}

.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.welcome{
  background:linear-gradient(135deg,rgba(15,107,95,.12),rgba(255,143,107,.1));
  border:1px solid var(--gb);
}

@media(max-width:400px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stat b{font-size:20px}
}


/* ========== REVOLUTION UI ========== */
.item-card{
  display:flex;gap:12px;align-items:flex-start;
  padding:14px;margin:0 -6px 8px;border-radius:16px;
  border:1px solid transparent;
  transition:background .15s,border-color .15s,transform .2s;
}
.item-card:active{transform:scale(.985)}
.item-card:hover{background:var(--navon);border-color:var(--gb)}
.item-card .ic-body{flex:1;min-width:0}
.item-card .ic-name{font-weight:650;font-size:16px;letter-spacing:-.02em;line-height:1.25}
.item-card .ic-meta{font-size:13px;color:var(--mu);margin-top:3px;line-height:1.4}
.item-card .ic-actions{display:flex;gap:4px;flex-shrink:0;opacity:.85}
.item-card .ic-actions button{padding:8px 10px;min-height:40px;border-radius:12px}
.item-card .badge{
  display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;
  background:var(--navon);color:var(--ac);margin-left:6px;vertical-align:middle;
}
.item-card .badge.hot{background:rgba(208,58,42,.12);color:var(--rd)}

.spotlight{
  position:relative;
}
.spotlight input{
  font-size:17px!important;padding:16px 16px 16px 48px!important;
  border-radius:18px!important;font-weight:500;
  border:1.5px solid var(--gb)!important;
  box-shadow:0 4px 20px -8px var(--sh);
}
.spotlight .sp-ico{
  position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:18px;pointer-events:none;opacity:.7;z-index:1;
}

.today-feed .feed-item{
  display:flex;align-items:center;gap:12px;padding:12px 0;
  border-bottom:1px solid var(--bd);cursor:pointer;
}
.today-feed .feed-item:last-child{border:0}
.today-feed .feed-ico{
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:var(--navon);flex-shrink:0;
}
.today-feed .feed-ico.hot{background:rgba(208,58,42,.12)}

.hero-title{
  font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mu);margin-bottom:4px;
}
.section-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
}
.section-head h2{margin:0}

.pill-nav{
  display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.pill-nav::-webkit-scrollbar{display:none}
.pill-nav button{
  flex-shrink:0;padding:8px 14px;border-radius:99px;font-size:13px;min-height:36px;
}

.cmdk{
  position:fixed;inset:0;z-index:30;display:none;
  background:rgba(8,14,12,.45);backdrop-filter:blur(12px);
  align-items:flex-start;justify-content:center;padding:12vh 16px 16px;
}
.cmdk.open{display:flex;animation:fade .2s both}
.cmdk-box{
  width:min(560px,100%);background:var(--sheet);border:1px solid var(--gb);
  border-radius:20px;overflow:hidden;
  box-shadow:0 24px 64px -16px rgba(0,0,0,.4);
  -webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
}
.cmdk-box input{
  border:0!important;border-radius:0!important;border-bottom:1px solid var(--bd)!important;
  padding:18px 18px!important;font-size:17px!important;margin:0!important;
  background:transparent!important;box-shadow:none!important;
}
.cmdk-results{max-height:50vh;overflow:auto;padding:8px}
.cmdk-item{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;
}
.cmdk-item:hover,.cmdk-item.active{background:var(--navon)}
.cmdk-item b{font-weight:600}
.cmdk-empty{padding:24px;text-align:center;color:var(--mu)}

.recent-chip{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;
  background:var(--field);border:1px solid var(--gb);font-size:13px;font-weight:500;
  margin:0 6px 6px 0;cursor:pointer;
}
.recent-chip:active{transform:scale(.96)}

.home-actions{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;
}
.home-actions button{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:14px 8px;border-radius:16px;font-size:12px;font-weight:600;
  min-height:0;
}
.home-actions button span.ico{font-size:22px;line-height:1}

@media(max-width:400px){
  .home-actions{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
}

 for(var y=0;y+h<=H.H&&!f;y+=10)for(var x=0;x+w<=H.W;x+=10){var P=r.poly.map(function(q){return[q[0]-b[0]+x,q[1]-b[1]+y]});if(!gOv(P,hs,FLR,-1)){f=P;break}}
 if(!f){var sx=Math.min(20,H.W-b[2]),sy=Math.min(20,H.H-b[3]);f=r.poly.map(function(q){return[q[0]+sx,q[1]+sy]})}
 S.rooms.push({n:r.n+' αντίγρ.',h:hs,fl:FLR,z:zTop(hs,FLR),f:[],poly:f,rect:!!r.rect,col:r.col});GS=S.rooms.length-1;GV=-1;save();geDraw();geUI()}

function gOpen(){cur=GS;view='room';render()}
function gCanvas(d){var H=hxOf(hs),mx=0,my=0;S.rooms.forEach(function(r){if(r.h==hs&&r.poly){var b=gBB(r.poly);mx=Math.max(mx,b[2]);my=Math.max(my,b[3])}});H.W=Math.max(400,mx+10,H.W+d*100);H.H=Math.max(300,my+10,H.H+d*70);ZV=null;save();render()}

function geUI(){var e=document.getElementById('fp');if(!e)return;var H=hxOf(hs);if(!H)return;var r=S.rooms[GS],h='<div class="card"><div class="row" style="padding-top:0"><h2 style="margin:0">✏️ Σχεδίαση σπιτιού</h2><button onclick="gDone()">Τέλος</button></div>';

 if(gmode==0)h+='<div class="path" style="margin-bottom:8px">'+(S.rooms.some(function(x){return x.h==hs&&x.poly&&(x.fl||0)==FLR})?'Πάτα έναν χώρο και σύρε τον. Μπορείς να τον βάλεις πάνω σε άλλον: ο πάνω «κόβει» τον χώρο του κάτω. Οι μεγάλοι κύκλοι στις γωνίες αλλάζουν μέγεθος· οι μικροί στις πλευρές προσθέτουν γωνία.':'Πάτα «＋ Ορθογώνιο» για γρήγορο χώρο ή «✏ Σχήμα» για να τον ζωγραφίσεις γωνία-γωνία.')+'</div>';
 else if(gmode==1)h+='<div class="path" style="margin-bottom:8px">Πάτα στον καμβά τις γωνίες του χώρου με τη σειρά. Για να κλείσεις, πάτα το κόκκινο πρώτο σημείο ή «Ολοκλήρωση». Σημεία: <b>'+GP.length+'</b></div><div class="chips" style="margin-bottom:8px"><button class="g" onclick="gUndoP()">↩ Αναίρεση σημείου</button><button onclick="gFin()">✓ Ολοκλήρωση</button><button class="g" onclick="gMode(0)">Άκυρο</button></div>';
 else h+='<div class="path" style="margin-bottom:8px">Πάτα πάνω σε τοίχο για να μπει πόρτα. Πάτα πάνω σε υπάρχουσα πόρτα για να φύγει.</div><div class="chips" style="margin-bottom:8px"><button class="g" onclick="gDoorsClear()">Καθαρισμός πορτών</button></div>';
 var RL=[];S.rooms.forEach(function(x,i){if(x.h==hs&&x.poly&&(x.fl||0)==FLR)RL.push(i)});if(RL.length)h+='<div class="chips" style="margin-bottom:8px"><span class="path" style="align-self:center">Χώροι:</span>'+RL.map(function(i){return '<button class="'+(i==GS?'':'g')+'" onclick="GS='+i+';GV=-1;gmode=0;geDraw();geUI()">'+esc(S.rooms[i].n)+'</button>'}).join('')+'</div>';
 h+='<div class="chips" style="margin-bottom:8px"><span class="path" style="align-self:center">Όροφος «'+esc(hFl(H)[FLR]||'')+'»:</span><button class="g" onclick="renFloor()">✎ Όνομα</button>'+(FLR>0?'<button class="g" onclick="gCopyBelow()">⬇ Κάτοψη από τον κάτω όροφο</button>':'')+(hFl(H).length>1?'<button class="r" onclick="delFloor()">🗑 Όροφος</button>':'')+'</div>';

 e.innerHTML=h}

function addFloor(){var H=hxOf(hs);if(!H)return;var F=hFl(H),d=F.length==1?'1ος όροφος':F.length+'ος όροφος';ask('Όνομα ορόφου',d,function(n){H.fl=F.concat([n]);FLR=H.fl.length-1;GS=-1;GV=-1;ZV=null;save();render();toast('Νέος όροφος «'+n+'». Σχεδίασε τους χώρους του· ο κάτω όροφος φαίνεται διακεκομμένος για οδηγό',1)})}

function delFloor(){var H=hxOf(hs);if(!H)return;var F=hFl(H);if(F.length<2)return;var idx=[];S.rooms.forEach(function(r,i){if(r.h==hs&&r.poly&&(r.fl||0)==FLR)idx.push(i)});var n=S.items.filter(function(i){return idx.indexOf(i.r)>=0}).length,fl=FLR;
 sure('Διαγραφή του ορόφου «'+F[fl]+'», των '+idx.length+' χώρων και '+n+' αντικειμένων του;',function(){rmRooms(idx);S.rooms.forEach(function(r){if(r.h==hs&&r.poly&&(r.fl||0)>fl)r.fl=(r.fl||0)-1});H.d=(H.d||[]).filter(function(d){return(d[4]||0)!=fl}).map(function(d){if((d[4]||0)>fl)d[4]=d[4]-1;return d});H.fl=F.slice();H.fl.splice(fl,1);FLR=Math.max(0,fl-1);GS=-1;GV=-1;ZV=null;save();render()})}
